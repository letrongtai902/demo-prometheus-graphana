apiVersion: 1
groups:
  - orgId: 1
    name: DemoApi Alerts
    folder: DemoApi Alerts
    interval: 10s
    rules:
      - uid: server-error-5xx
        title: "Server Error (5xx) Detected"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: "sum(increase(http_request_duration_seconds_count{job=\"demoapi\",code=~\"5..\"}[1m])) or vector(0)"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Server Error (5xx) detected in DemoApi"
          description: "5xx errors have been detected in the last minute. Check the HTTP Overview dashboard for details."
